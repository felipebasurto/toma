name: Deploy landing

on:
  push:
    branches: [main]
    paths: ["landing/**"]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 667627f7c0f576c6142f43b607c01d58
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy landing to Cloudflare Pages (project toma)
        run: npx --yes wrangler@4 pages deploy landing --project-name toma --branch main --commit-hash "$GITHUB_SHA"
